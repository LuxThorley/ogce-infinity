[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="ogce-infinity"
version="8.2.0"
description="OGCE Infinity v8.2 — online-first arcana, science and invention game platform"
requires-python=">=3.10"
dependencies=[]
[project.optional-dependencies]
render=["panda3d>=1.10.14,<1.11"]
test=["pytest>=8,<9"]
server=["uvicorn>=0.29,<1","websockets>=12,<16"]
desktop=["pywebview>=5,<7"]
api=["fastapi>=0.110,<1"]
[project.scripts]
ogce4="ogce4.cli:main"
ogce5="ogce4.cli_v5:main"
ogce51="ogce4.cli_v51:main"
ogce52="ogce4.cli_v52:main"
ogce53="ogce4.cli_v53:main"
ogce6="ogce4.cli_v6:main"
ogce61="ogce4.cli_v61:main"
ogce62="ogce4.cli_v62:main"
ogce70="ogce4.v70.cli:main"
ogce71="ogce4.v70.cli:main"
ogce72="ogce4.v70.cli:main"
ogce73="ogce4.v70.cli:main"
ogce74="ogce4.v70.cli:main"
ogce80="ogce4.v80.cli:main"
[tool.setuptools.packages.find]
include=["ogce4*"]
[tool.pytest.ini_options]
testpaths=["tests"]
